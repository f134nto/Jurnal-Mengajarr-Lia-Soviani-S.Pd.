        function App() {
          const [activeTab, setActiveTab] = useState('jurnal');
          const [activeClass, setActiveClass] = useState('7A');
          const [activeMonth, setActiveMonth] = useState('Juli');
          
          const [attendance, setAttendance] = useState(() => {
            try {
              return JSON.parse(localStorage.getItem('jurnal_attendance')) || {};
            } catch (e) {
              return {};
            }
          });
          const [classNotes, setClassNotes] = useState(() => {
            try {
              return JSON.parse(localStorage.getItem('jurnal_classNotes')) || {};
            } catch (e) {
              return {};
            }
          });
          const [savingsData, setSavingsData] = useState(() => {
            try {
              return JSON.parse(localStorage.getItem('jurnal_savingsData')) || {};
            } catch (e) {
              return {};
            }
          });
          
          const [syncStatus, setSyncStatus] = useState('');
          const [isSyncing, setIsSyncing] = useState(false);

          const scriptUrl = "https://script.google.com/macros/s/AKfycbxzfZ6UtDe2KzQe_92mGkt2Wpqf3OkGsT3nC1FXffEWUHjKMCS9Sc9YhnXFLrnv8VA/exec";

          useEffect(() => {
            localStorage.setItem('jurnal_attendance', JSON.stringify(attendance));
          }, [attendance]);

          useEffect(() => {
            localStorage.setItem('jurnal_classNotes', JSON.stringify(classNotes));
          }, [classNotes]);

          useEffect(() => {
            localStorage.setItem('jurnal_savingsData', JSON.stringify(savingsData));
          }, [savingsData]);

          const getDaysInMonth = (month) => {
            if (month === 'Juli') {
              return Array.from({ length: 19 }, (_, i) => i + 13);
            }
            return Array.from({ length: 31 }, (_, i) => i + 1);
          };

          const daysInMonth = getDaysInMonth(activeMonth);
          const [actionDay, setActionDay] = useState(activeMonth === 'Juli' ? 13 : 1);

          const today = new Date();
          const options = { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric' };
          const currentDateStr = today.toLocaleDateString('id-ID', options);

          const currentStudents = INITIAL_STUDENTS[activeClass] || [];

          const toggleAttendance = (student, day) => {
            const key = `${activeClass}-${activeMonth}-${student}-${day}`;
            const current = attendance[key];
            let nextStatus = '';
            if (!current) nextStatus = 'H';
            else if (current === 'H') nextStatus = 'I';
            else if (current === 'I') nextStatus = 'S';
            else if (current === 'S') nextStatus = 'A';
            else nextStatus = '';

            setAttendance(prev => ({ ...prev, [key]: nextStatus }));
          };

          const getRekap = (student) => {
            let rekap = { H: 0, I: 0, S: 0, A: 0 };
            daysInMonth.forEach(day => {
              const status = attendance[`${activeClass}-${activeMonth}-${student}-${day}`];
              if (status && rekap[status] !== undefined) {
                rekap[status]++;
              }
            });
            return rekap;
          };

          const getStudentTotalSavings = (student) => {
            let total = 0;
            daysInMonth.forEach(d => {
              const key = `${activeClass}-${activeMonth}-${student}-${d}`;
              const val = parseFloat(savingsData[key]) || 0;
              total += val;
            });
            return total;
          };

          const getDailyTotalSavings = (day) => {
            let total = 0;
            currentStudents.forEach(student => {
              const key = `${activeClass}-${activeMonth}-${student}-${day}`;
              const val = parseFloat(savingsData[key]) || 0;
              total += val;
            });
            return total;
          };

          const handleHadirSemua = () => {
            setAttendance(prev => {
              const newAttendance = { ...prev };
              currentStudents.forEach(student => {
                const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
                newAttendance[key] = 'H';
              });
              return newAttendance;
            });
          };

          const handleReset = () => {
            setAttendance(prev => {
              const newAttendance = { ...prev };
              currentStudents.forEach(student => {
                const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
                delete newAttendance[key];
              });
              return newAttendance;
            });
          };

          const handleNoteChange = (field, value) => {
            const key = `${activeClass}-${activeMonth}-${actionDay}-${field}`;
            setClassNotes(prev => ({ ...prev, [key]: value }));
          };
          
          const handleSavingChange = (student, value) => {
            const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
            setSavingsData(prev => ({ ...prev, [key]: value }));
          };

          const handleSyncToSpreadsheet = async () => {
            if (isSyncing) return;
            setIsSyncing(true);
            setSyncStatus('Sabar Kirim Data...');

            let headers = ["Nama Siswa"];
            for (let i = 1; i <= 31; i++) {
              headers.push(i.toString());
            }

            let rows = [];
            currentStudents.forEach((student) => {
              let row = [student];

              for (let i = 1; i <= 31; i++) {
                if (activeMonth === 'Juli') {
                  if (i >= 13) {
                    const status = attendance[`${activeClass}-${activeMonth}-${student}-${i}`] || '';
                    row.push(status);
                  } else {
                    row.push('');
                  }
                } else {
                  const status = attendance[`${activeClass}-${activeMonth}-${student}-${i}`] || '';
                  row.push(status);
                }
              }
              rows.push(row);
            });

            rows.push(Array(32).fill(""));

            let materiRow = Array(32).fill("");
            materiRow[0] = "Materi Pokok/Sub Pokok Bahasan";
            
            for (let i = 1; i <= 31; i++) {
              materiRow[i] = classNotes[`${activeClass}-${activeMonth}-${i}-materi`] || "";
            }
            
            rows.push(materiRow);

            try {
              const payload = {
                sheetName: `${activeClass}_${activeMonth}`,
                headers: headers,
                rows: rows
              };

              await fetch(scriptUrl, {
                method: 'POST',
                mode: 'no-cors',
                headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                body: JSON.stringify(payload)
              });

              setSyncStatus('Berhasil, Lia Soviani, S.Pd.');
              setTimeout(() => setSyncStatus(''), 5000);
            } catch (err) {
              setSyncStatus('Gagal sinkronisasi: ' + err.message);
            } finally {
              setIsSyncing(false);
            }
          };

          const handleExportCSV = () => {
            let csvContent = "\uFEFF";
            csvContent += `E-JURNAL & ABSENSI BAHASA INGGRIS - KELAS ${activeClass} (${activeMonth.toUpperCase()})\n\n`;

                                  type="button"
                                  onClick={handleExportSavingsCSV}
                                  className="px-3 py-2 bg-white border border-slate-300 hover:bg-slate-50 text-slate-700 font-bold rounded-lg text-xs shadow-xs transition-all touch-manipulation whitespace-nowrap flex-1 sm:flex-none"
                              >
                                  Unduh CSV
                              </button>
                              <button
                                  type="button"
                                  disabled={isSyncing}
                                  onClick={handleSyncSavings}
                                  className={`px-4 py-2 font-bold rounded-lg text-xs shadow-xs transition-all touch-manipulation whitespace-nowrap flex-1 sm:flex-none ${isSyncing ? 'bg-emerald-400 text-white cursor-not-allowed' : 'bg-emerald-600 hover:bg-emerald-700 text-white'}`}
                              >
                                  {isSyncing ? 'Mengirim...' : 'Kirim Data'}
                              </button>
                          </div>
                      </div>
                      <div className="overflow-x-auto custom-scrollbar" style={{ maxHeight: '60vh' }}>
                          <table className="w-full text-sm text-left">
                              <thead className="sticky top-0 z-10 shadow-xs">
                                  <tr>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 w-12 text-center bg-[#7DA3A1] text-slate-900">No.</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 min-w-[200px] bg-[#7DA3A1] text-slate-900">Nama Siswa</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-slate-50 text-slate-700 min-w-[180px]">Nominal Tabungan (Tgl {actionDay})</th>
                                      <th className="py-3 px-4 font-bold border-b border-slate-200 bg-amber-100 text-amber-900 min-w-[160px] text-right">Total Bulanan</th>
                                  </tr>
                              </thead>
                              <tbody>
                                  {currentStudents.map((student, idx) => {
                                      const key = `${activeClass}-${activeMonth}-${student}-${actionDay}`;
                                      const studentTotal = getStudentTotalSavings(student);
                                      return (
                                          <tr key={idx} className="border-b border-slate-100 hover:bg-slate-50 transition-colors">
                                              <td className="py-2 px-4 text-center font-bold text-slate-800 bg-[#7DA3A1]">{idx + 1}</td>
                                              <td className="py-2 px-4 font-bold text-slate-900 bg-[#7DA3A1]">{student}</td>
                                              <td className="py-2 px-4">
                                                  <div className="flex items-center gap-2 max-w-[200px]">
                                                      <span className="text-slate-400 text-xs font-bold">Rp</span>
                                                      <input 
                                                          type="number"
                                                          placeholder="0"
                                                          value={savingsData[key] || ''}
                                                          onChange={(e) => handleSavingChange(student, e.target.value)}
                                                          className="w-full px-3 py-1.5 border border-slate-200 rounded-md bg-white text-slate-700 font-semibold focus:outline-none focus:border-amber-500 focus:ring-1 focus:ring-amber-500"
                                                      />
                                                  </div>
                                              </td>
                                              <td className="py-2 px-4 text-right font-bold text-emerald-700 bg-amber-50/30">
                                                  Rp {studentTotal.toLocaleString('id-ID')}
                                              </td>
                                          </tr>
                                      )
                                  })}
                                  {currentStudents.length === 0 && (
                                      <tr><td colSpan="4" className="py-8 text-center text-slate-400">Pilih kelas terlebih dahulu</td></tr>
                                  )}
                              </tbody>
                              {currentStudents.length > 0 && (
                                <tfoot className="bg-slate-100 font-bold border-t-2 border-slate-300">
                                  <tr>
                                    <td colSpan="2" className="py-3 px-4 text-slate-800 text-right">TOTAL HARIAN (TGL {actionDay}):</td>
                                    <td className="py-3 px-4 text-emerald-800 font-extrabold text-base">
                                      Rp {getDailyTotalSavings(actionDay).toLocaleString('id-ID')}
                                    </td>
                                    <td className="py-3 px-4 text-right text-emerald-900 font-black text-base bg-amber-200/50">
                                      Rp {currentStudents.reduce((acc, st) => acc + getStudentTotalSavings(st), 0).toLocaleString('id-ID')}
                                    </td>
                                  </tr>
                                </tfoot>
                              )}
                          </table>
                      </div>
                   </div>
                )}

              </div>
            </div>
          );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
